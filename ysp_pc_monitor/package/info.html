  <h1>YSP PC Monitor</h1>
  <p>Multi-page PC monitor for the local HoloBridge SSE stream.</p>
  <p>Tilt left/right to switch SYSTEM, THERMAL, POWER, and NETWORK. AMBIENT appears when PC data is stale.</p>
